<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MiCrecimiento">
    <title>Mi Crecimiento Personal</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* ===== PANTALLA DE BLOQUEO ===== */
        #lockScreen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            user-select: none;
        }
        
        .lock-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .lock-header .emoji {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .lock-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #fbbf24, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .lock-header p {
            color: #94a3b8;
            font-size: 14px;
        }
        
        .lock-error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 8px;
            min-height: 20px;
        }
        
        .pattern-container {
            width: 280px;
            height: 280px;
            position: relative;
            touch-action: none;
        }
        
        .pattern-dot {
            position: absolute;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pattern-dot-inner {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.15s ease;
        }
        
        .pattern-dot-inner.active {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #fbbf24, #f97316);
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
        }
        
        .pattern-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .pattern-line {
            stroke: #f97316;
            stroke-width: 4;
            stroke-linecap: round;
            fill: none;
        }
        
        .reset-btn {
            margin-top: 40px;
            padding: 12px 24px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #64748b;
            font-size: 14px;
            cursor: pointer;
        }
        
        /* ===== APP PRINCIPAL ===== */
        #mainApp {
            display: none;
            padding-bottom: 100px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        
        .header {
            text-align: center;
            padding: 24px 0;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #fbbf24, #f97316, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        
        .header p {
            color: #94a3b8;
            font-size: 14px;
        }
        
        .logout-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 10px 16px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 10px;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            z-index: 100;
        }
        
        /* Planta */
        .plant-container {
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 100%);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        
        .plant-emoji {
            font-size: 80px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(34, 197, 94, 0.3));
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .plant-stage {
            font-size: 18px;
            font-weight: 700;
            color: #22c55e;
            margin-bottom: 4px;
            text-transform: capitalize;
        }
        
        .plant-count {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        
        .progress-bar-container {
            margin-top: 12px;
        }
        
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .progress-text {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Botones principales */
        .action-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn-add {
            padding: 14px 24px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }
        
        .filter-select {
            flex: 1;
            padding: 14px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        
        .filter-select option {
            background: #1e293b;
            color: white;
        }
        
        /* Formulario */
        .form-container {
            display: none;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .form-container.show {
            display: block;
        }
        
        .form-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .form-group {
            margin-bottom: 14px;
        }
        
        .form-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #64748b;
        }
        
        .form-group textarea {
            resize: none;
            min-height: 80px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .form-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .btn-primary {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }
        
        .btn-secondary {
            padding: 14px 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        
        /* Lista de metas */
        .metas-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-state .emoji {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        .empty-state h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            color: #64748b;
        }
        
        /* Tarjeta de meta */
        .meta-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .meta-card-inner {
            display: flex;
        }
        
        .meta-accent {
            width: 4px;
            background: linear-gradient(180deg, #f59e0b, #f97316);
        }
        
        .meta-content {
            flex: 1;
            padding: 20px;
        }
        
        .meta-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 12px;
        }
        
        .meta-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .meta-emoji {
            font-size: 24px;
        }
        
        .meta-title {
            font-size: 20px;
            font-weight: 700;
        }
        
        .meta-date {
            font-size: 12px;
            color: #64748b;
        }
        
        .meta-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }
        
        .badge-activo {
            background: rgba(59,130,246,0.2);
            color: #3b82f6;
        }
        
        .badge-logrado {
            background: rgba(34,197,94,0.2);
            color: #22c55e;
        }
        
        .badge-pausado {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
        }
        
        .meta-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            font-size: 13px;
        }
        
        .meta-stat-label {
            color: #64748b;
        }
        
        .meta-stat-value {
            font-weight: 700;
        }
        
        .meta-description {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            border-left: 3px solid #f59e0b;
            margin-bottom: 12px;
        }
        
        .meta-description p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .meta-goal {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            background: rgba(34,197,94,0.15);
            color: #22c55e;
        }
        
        /* Avances */
        .avances-toggle {
            background: none;
            border: none;
            color: #64748b;
            font-size: 13px;
            cursor: pointer;
            padding: 8px 0;
        }
        
        .avances-list {
            display: none;
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .avances-list.show {
            display: block;
        }
        
        .avance-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .avance-icon {
            font-size: 16px;
        }
        
        .avance-icon.positivo {
            color: #22c55e;
        }
        
        .avance-icon.negativo {
            color: #ef4444;
        }
        
        .avance-text {
            flex: 1;
        }
        
        .avance-date {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
        
        /* Formulario de avance */
        .avance-form {
            display: none;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin: 12px 0;
        }
        
        .avance-form.show {
            display: block;
        }
        
        .avance-form input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }
        
        .avance-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .avance-type-btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .avance-type-btn.selected-positive {
            background: #22c55e;
        }
        
        .avance-type-btn.selected-negative {
            background: #ef4444;
        }
        
        .avance-type-btn.save {
            background: #f59e0b;
        }
        
        /* Acciones de meta */
        .meta-actions {
            display: flex;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .action-btn.add-avance {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .action-btn.complete {
            background: rgba(34,197,94,0.2);
            color: #22c55e;
        }
        
        .action-btn.reactivate {
            background: rgba(59,130,246,0.2);
            color: #3b82f6;
        }
        
        .action-btn.pause {
            background: rgba(249,115,22,0.2);
            color: #f97316;
        }
        
        .action-btn.delete {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            margin-left: auto;
        }
        
        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .loading .emoji {
            font-size: 48px;
            margin-bottom: 16px;
            animation: float 2s ease-in-out infinite;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Pantalla de carga -->
    <div id="loadingScreen" class="loading">
        <div class="emoji">🌱</div>
        <p style="color: #94a3b8;">Cargando...</p>
    </div>

    <!-- Pantalla de bloqueo -->
    <div id="lockScreen" class="hidden">
        <div class="lock-header">
            <div class="emoji">🌱</div>
            <h1>Mi Crecimiento Personal</h1>
            <p id="lockMessage">Dibuja tu patrón para entrar</p>
            <div class="lock-error" id="lockError"></div>
        </div>
        
        <div class="pattern-container" id="patternContainer">
            <svg class="pattern-svg" id="patternSvg"></svg>
        </div>
        
        <button class="reset-btn" onclick="resetPattern()">Resetear patrón</button>
    </div>

    <!-- App principal -->
    <div id="mainApp">
        <button class="logout-btn" onclick="logout()">🔒 Bloquear</button>
        
        <div class="container">
            <header class="header">
                <h1>Mi Crecimiento Personal</h1>
                <p>Registra, aprende y crece cada día</p>
            </header>
            
            <!-- Planta -->
            <div class="plant-container" id="plantContainer">
                <div class="plant-emoji" id="plantEmoji">🌱</div>
                <div class="plant-stage" id="plantStage">semilla</div>
                <div class="plant-count" id="plantCount">0 logros alcanzados</div>
                <div class="progress-bar-container" id="progressContainer">
                    <div class="progress-labels">
                        <span id="currentStageLabel">🌱 semilla</span>
                        <span id="nextStageLabel">🌿 brote</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <p class="progress-text" id="progressText">3 logros más para evolucionar</p>
                </div>
            </div>
            
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total Metas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value" id="statActivas">0</div>
                    <div class="stat-label">Activas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🏆</div>
                    <div class="stat-value" id="statLogradas">0</div>
                    <div class="stat-label">Logradas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💵</div>
                    <div class="stat-value" id="statInversion">$0</div>
                    <div class="stat-label">Invertido</div>
                </div>
            </div>
            
            <!-- Acciones -->
            <div class="action-row">
                <button class="btn-add" onclick="toggleForm()">+ Nueva Meta</button>
                <select class="filter-select" id="filterSelect" onchange="filterMetas()">
                    <option value="todas">Todas</option>
                    <option value="salud">🏥 Salud</option>
                    <option value="estetica">✨ Estética</option>
                    <option value="habilidad">🎯 Habilidad</option>
                    <option value="educacion">📚 Educación</option>
                    <option value="habito">🔄 Hábito</option>
                    <option value="fitness">💪 Fitness</option>
                    <option value="finanzas">💰 Finanzas</option>
                    <option value="proyecto">🚀 Proyecto</option>
                    <option value="otro">📌 Otro</option>
                </select>
            </div>
            
            <!-- Formulario -->
            <div class="form-container" id="formContainer">
                <h2 class="form-title">Nueva Meta de Crecimiento</h2>
                
                <div class="form-group">
                    <label>¿Qué quieres lograr?</label>
                    <input type="text" id="inputTitulo" placeholder="Ej: Aprender guitarra, Ortodoncia...">
                </div>
                
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="inputCategoria">
                        <option value="salud">🏥 Salud</option>
                        <option value="estetica">✨ Estética</option>
                        <option value="habilidad" selected>🎯 Habilidad</option>
                        <option value="educacion">📚 Educación</option>
                        <option value="habito">🔄 Hábito</option>
                        <option value="fitness">💪 Fitness</option>
                        <option value="finanzas">💰 Finanzas</option>
                        <option value="proyecto">🚀 Proyecto</option>
                        <option value="otro">📌 Otro</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Descripción / Detalles</label>
                    <textarea id="inputDescripcion" placeholder="Describe tu meta, el plan..."></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Fecha inicio</label>
                        <input type="date" id="inputFecha">
                    </div>
                    <div class="form-group">
                        <label>Inversión $</label>
                        <input type="number" id="inputInversion" placeholder="0" min="0">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Meta final / Objetivo</label>
                    <input type="text" id="inputMetaFinal" placeholder="Ej: Tocar 5 canciones, Certificarme...">
                </div>
                
                <div class="form-buttons">
                    <button class="btn-primary" onclick="saveMeta()">Guardar Meta</button>
                    <button class="btn-secondary" onclick="toggleForm()">Cancelar</button>
                </div>
            </div>
            
            <!-- Lista de metas -->
            <div class="metas-list" id="metasList"></div>
        </div>
    </div>

    <script>
        // ===== CONFIGURACIÓN FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyBfrsG0FreWxoGSLMtTTol0raK45nsmglE",
            authDomain: "crecimiento-personal-3e72d.firebaseapp.com",
            projectId: "crecimiento-personal-3e72d",
            storageBucket: "crecimiento-personal-3e72d.firebasestorage.app",
            messagingSenderId: "748066493575",
            appId: "1:748066493575:web:b5da1556caca9f7235d422"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ===== VARIABLES GLOBALES =====
        const PATTERN_KEY = 'mi_crecimiento_pattern_2024';
        const SESSION_KEY = 'mi_crecimiento_session_2024';
        const SESSION_DURATION = 30 * 60 * 1000;
        
        let metas = [];
        let currentPattern = [];
        let isDrawing = false;
        let patternMode = 'check';
        let tempPattern = [];
        let currentFilter = 'todas';

        const CATEGORIAS = {
            salud: { nombre: 'Salud', emoji: '🏥' },
            estetica: { nombre: 'Estética', emoji: '✨' },
            habilidad: { nombre: 'Habilidad', emoji: '🎯' },
            educacion: { nombre: 'Educación', emoji: '📚' },
            habito: { nombre: 'Hábito', emoji: '🔄' },
            fitness: { nombre: 'Fitness', emoji: '💪' },
            finanzas: { nombre: 'Finanzas', emoji: '💰' },
            proyecto: { nombre: 'Proyecto', emoji: '🚀' },
            otro: { nombre: 'Otro', emoji: '📌' }
        };

        const PLANT_STAGES = [
            { min: 0, name: 'semilla', emoji: '🌱' },
            { min: 3, name: 'brote', emoji: '🌿' },
            { min: 7, name: 'planta pequeña', emoji: '☘️' },
            { min: 12, name: 'planta mediana', emoji: '🪴' },
            { min: 20, name: 'arbusto', emoji: '🌳' },
            { min: 30, name: 'árbol', emoji: '🌲' },
            { min: 50, name: 'árbol frutal', emoji: '🍀' },
            { min: 75, name: 'jardín', emoji: '🌸' },
            { min: 100, name: 'bosque', emoji: '🌺' }
        ];

        // ===== INICIALIZACIÓN =====
        document.addEventListener('DOMContentLoaded', init);

        function init() {
            setupPatternDots();
            checkSession();
        }

        function checkSession() {
            const session = localStorage.getItem(SESSION_KEY);
            const savedPattern = localStorage.getItem(PATTERN_KEY);
            
            if (session && (Date.now() - parseInt(session)) < SESSION_DURATION) {
                showMainApp();
            } else {
                localStorage.removeItem(SESSION_KEY);
                if (!savedPattern) {
                    patternMode = 'create';
                    document.getElementById('lockMessage').textContent = 'Crea tu patrón de desbloqueo';
                }
                showLockScreen();
            }
        }

        // ===== PATRÓN DE BLOQUEO =====
        function setupPatternDots() {
            const container = document.getElementById('patternContainer');
            
            for (let i = 0; i < 9; i++) {
                const row = Math.floor(i / 3);
                const col = i % 3;
                
                const dot = document.createElement('div');
                dot.className = 'pattern-dot';
                dot.style.left = `${(col + 0.5) * 33.33}%`;
                dot.style.top = `${(row + 0.5) * 33.33}%`;
                dot.style.transform = 'translate(-50%, -50%)';
                dot.innerHTML = '<div class="pattern-dot-inner" data-index="' + i + '"></div>';
                container.appendChild(dot);
            }
            
            container.addEventListener('mousedown', startPattern);
            container.addEventListener('mousemove', movePattern);
            container.addEventListener('mouseup', endPattern);
            container.addEventListener('mouseleave', endPattern);
            container.addEventListener('touchstart', startPattern, { passive: false });
            container.addEventListener('touchmove', movePattern, { passive: false });
            container.addEventListener('touchend', endPattern);
        }

        function getPointFromEvent(e, rect) {
            const point = e.touches ? e.touches[0] : e;
            return {
                x: point.clientX - rect.left,
                y: point.clientY - rect.top
            };
        }

        function getDotFromPoint(x, y, rect) {
            const dotSize = rect.width / 3;
            const col = Math.floor(x / dotSize);
            const row = Math.floor(y / dotSize);
            
            if (col >= 0 && col < 3 && row >= 0 && row < 3) {
                return row * 3 + col;
            }
            return -1;
        }

        function startPattern(e) {
            e.preventDefault();
            isDrawing = true;
            currentPattern = [];
            clearPatternVisual();
            document.getElementById('lockError').textContent = '';
            
            const rect = e.currentTarget.getBoundingClientRect();
            const point = getPointFromEvent(e, rect);
            const dot = getDotFromPoint(point.x, point.y, rect);
            
            if (dot >= 0) {
                currentPattern.push(dot);
                highlightDot(dot);
            }
        }

        function movePattern(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const rect = e.currentTarget.getBoundingClientRect();
            const point = getPointFromEvent(e, rect);
            const dot = getDotFromPoint(point.x, point.y, rect);
            
            if (dot >= 0 && !currentPattern.includes(dot)) {
                currentPattern.push(dot);
                highlightDot(dot);
                drawLines();
            }
        }

        function endPattern() {
            if (!isDrawing) return;
            isDrawing = false;
            
            if (currentPattern.length < 4) {
                document.getElementById('lockError').textContent = 'Mínimo 4 puntos';
                setTimeout(clearPatternVisual, 500);
                return;
            }
            
            const patternStr = currentPattern.join('-');
            
            if (patternMode === 'create') {
                tempPattern = [...currentPattern];
                patternMode = 'confirm';
                document.getElementById('lockMessage').textContent = 'Confirma tu patrón';
                setTimeout(clearPatternVisual, 500);
            } else if (patternMode === 'confirm') {
                if (patternStr === tempPattern.join('-')) {
                    localStorage.setItem(PATTERN_KEY, patternStr);
                    document.getElementById('lockMessage').textContent = '¡Patrón creado!';
                    setTimeout(() => {
                        localStorage.setItem(SESSION_KEY, Date.now().toString());
                        showMainApp();
                    }, 500);
                } else {
                    document.getElementById('lockError').textContent = 'No coinciden, intenta de nuevo';
                    patternMode = 'create';
                    tempPattern = [];
                    document.getElementById('lockMessage').textContent = 'Crea tu patrón de desbloqueo';
                    setTimeout(clearPatternVisual, 500);
                }
            } else {
                const savedPattern = localStorage.getItem(PATTERN_KEY);
                if (patternStr === savedPattern) {
                    document.getElementById('lockMessage').textContent = '¡Bienvenido!';
                    setTimeout(() => {
                        localStorage.setItem(SESSION_KEY, Date.now().toString());
                        showMainApp();
                    }, 300);
                } else {
                    document.getElementById('lockError').textContent = 'Patrón incorrecto';
                    setTimeout(clearPatternVisual, 500);
                }
            }
        }

        function highlightDot(index) {
            const dots = document.querySelectorAll('.pattern-dot-inner');
            dots[index].classList.add('active');
        }

        function clearPatternVisual() {
            const dots = document.querySelectorAll('.pattern-dot-inner');
            dots.forEach(dot => dot.classList.remove('active'));
            document.getElementById('patternSvg').innerHTML = '';
            currentPattern = [];
        }

        function drawLines() {
            const svg = document.getElementById('patternSvg');
            svg.innerHTML = '';
            
            for (let i = 1; i < currentPattern.length; i++) {
                const from = currentPattern[i - 1];
                const to = currentPattern[i];
                
                const fromRow = Math.floor(from / 3);
                const fromCol = from % 3;
                const toRow = Math.floor(to / 3);
                const toCol = to % 3;
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', `${(fromCol + 0.5) * 33.33}%`);
                line.setAttribute('y1', `${(fromRow + 0.5) * 33.33}%`);
                line.setAttribute('x2', `${(toCol + 0.5) * 33.33}%`);
                line.setAttribute('y2', `${(toRow + 0.5) * 33.33}%`);
                line.setAttribute('class', 'pattern-line');
                svg.appendChild(line);
            }
        }

        function resetPattern() {
            if (confirm('¿Resetear el patrón? Esto borrará tu patrón actual.')) {
                localStorage.removeItem(PATTERN_KEY);
                patternMode = 'create';
                tempPattern = [];
                document.getElementById('lockMessage').textContent = 'Crea tu nuevo patrón';
                document.getElementById('lockError').textContent = '';
                clearPatternVisual();
            }
        }

        // ===== NAVEGACIÓN =====
        function showLockScreen() {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('lockScreen').classList.remove('hidden');
            document.getElementById('mainApp').style.display = 'none';
        }

        function showMainApp() {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('lockScreen').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'block';
            loadMetas();
        }

        function logout() {
            localStorage.removeItem(SESSION_KEY);
            patternMode = 'check';
            document.getElementById('lockMessage').textContent = 'Dibuja tu patrón para entrar';
            document.getElementById('lockError').textContent = '';
            clearPatternVisual();
            showLockScreen();
        }

        // ===== FIREBASE / METAS =====
        function loadMetas() {
            db.collection('metas').orderBy('fechaCreacion', 'desc').onSnapshot(snapshot => {
                metas = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderMetas();
                updateStats();
                updatePlant();
            }, error => {
                console.error('Error:', error);
                document.getElementById('metasList').innerHTML = '<div class="empty-state"><div class="emoji">⚠️</div><h3>Error de conexión</h3><p>Verifica tu internet y recarga</p></div>';
            });
        }

        function saveMeta() {
            const titulo = document.getElementById('inputTitulo').value.trim();
            if (!titulo) {
                alert('Escribe un título para tu meta');
                return;
            }
            
            const meta = {
                titulo,
                categoria: document.getElementById('inputCategoria').value,
                descripcion: document.getElementById('inputDescripcion').value.trim(),
                fechaInicio: document.getElementById('inputFecha').value,
                inversion: document.getElementById('inputInversion').value || '0',
                metaFinal: document.getElementById('inputMetaFinal').value.trim(),
                estado: 'activo',
                avances: [],
                fechaCreacion: new Date().toISOString()
            };
            
            db.collection('metas').add(meta).then(() => {
                clearForm();
                toggleForm();
            }).catch(error => {
                console.error('Error:', error);
                alert('Error al guardar');
            });
        }

        function clearForm() {
            document.getElementById('inputTitulo').value = '';
            document.getElementById('inputCategoria').value = 'habilidad';
            document.getElementById('inputDescripcion').value = '';
            document.getElementById('inputFecha').value = '';
            document.getElementById('inputInversion').value = '';
            document.getElementById('inputMetaFinal').value = '';
        }

        function toggleForm() {
            document.getElementById('formContainer').classList.toggle('show');
        }

        function filterMetas() {
            currentFilter = document.getElementById('filterSelect').value;
            renderMetas();
        }

        function renderMetas() {
            const container = document.getElementById('metasList');
            let filtered = currentFilter === 'todas' ? metas : metas.filter(m => m.categoria === currentFilter);
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="emoji">🌱</div><h3>Comienza tu viaje</h3><p>Agrega tu primera meta y empieza a crecer</p></div>';
                return;
            }
            
            container.innerHTML = filtered.map(meta => {
                const cat = CATEGORIAS[meta.categoria] || CATEGORIAS.otro;
                const avances = meta.avances || [];
                const positivos = avances.filter(a => a.resultado === 'positivo').length;
                const porcentaje = avances.length > 0 ? Math.round((positivos / avances.length) * 100) : 0;
                
                let badgeClass = 'badge-activo';
                let badgeText = '🔥 Activo';
                if (meta.estado === 'logrado') { badgeClass = 'badge-logrado'; badgeText = '🏆 Logrado'; }
                if (meta.estado === 'pausado') { badgeClass = 'badge-pausado'; badgeText = '⏸️ Pausado'; }
                
                return `
                    <div class="meta-card" data-id="${meta.id}">
                        <div class="meta-card-inner">
                            <div class="meta-accent"></div>
                            <div class="meta-content">
                                <div class="meta-header">
                                    <div>
                                        <div class="meta-title-row">
                                            <span class="meta-emoji">${cat.emoji}</span>
                                            <span class="meta-title">${meta.titulo}</span>
                                        </div>
                                        ${meta.fechaInicio ? `<div class="meta-date">Inicio: ${new Date(meta.fechaInicio).toLocaleDateString('es-MX')}</div>` : ''}
                                    </div>
                                    <span class="meta-badge ${badgeClass}">${badgeText}</span>
                                </div>
                                
                                <div class="meta-stats">
                                    ${meta.inversion && parseFloat(meta.inversion) > 0 ? `<div><span class="meta-stat-label">Inversión: </span><span class="meta-stat-value" style="color:#f59e0b">$${parseFloat(meta.inversion).toLocaleString()}</span></div>` : ''}
                                    <div><span class="meta-stat-label">Avances: </span><span class="meta-stat-value">${avances.length}</span></div>
                                    ${avances.length > 0 ? `<div><span class="meta-stat-label">Éxito: </span><span class="meta-stat-value" style="color:${porcentaje >= 70 ? '#22c55e' : porcentaje >= 40 ? '#f59e0b' : '#ef4444'}">${porcentaje}%</span></div>` : ''}
                                </div>
                                
                                ${meta.descripcion ? `<div class="meta-description"><p>${meta.descripcion}</p></div>` : ''}
                                
                                ${meta.metaFinal ? `<div class="meta-goal"><span>🎯</span><span>${meta.metaFinal}</span></div>` : ''}
                                
                                ${avances.length > 0 ? `
                                    <button class="avances-toggle" onclick="toggleAvances('${meta.id}')">▶ Ver ${avances.length} avance(s)</button>
                                    <div class="avances-list" id="avances-${meta.id}">
                                        ${avances.slice().reverse().map(a => `
                                            <div class="avance-item">
                                                <span class="avance-icon ${a.resultado}">${a.resultado === 'positivo' ? '✓' : '✗'}</span>
                                                <div class="avance-text">
                                                    <div>${a.texto}</div>
                                                    <div class="avance-date">${new Date(a.fecha).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                                
                                <div class="avance-form" id="avanceForm-${meta.id}">
                                    <input type="text" id="avanceInput-${meta.id}" placeholder="¿Qué avance tuviste?">
                                    <div class="avance-buttons">
                                        <button class="avance-type-btn" id="btnPositivo-${meta.id}" onclick="selectAvanceType('${meta.id}', 'positivo')">✓ Cumplí</button>
                                        <button class="avance-type-btn" id="btnNegativo-${meta.id}" onclick="selectAvanceType('${meta.id}', 'negativo')">✗ Fallé</button>
                                        <button class="avance-type-btn save" onclick="saveAvance('${meta.id}')">Guardar</button>
                                        <button class="avance-type-btn" onclick="toggleAvanceForm('${meta.id}')">✕</button>
                                    </div>
                                </div>
                                
                                <div class="meta-actions">
                                    <button class="action-btn add-avance" onclick="toggleAvanceForm('${meta.id}')">+ Avance</button>
                                    ${meta.estado !== 'logrado' ? `<button class="action-btn complete" onclick="updateEstado('${meta.id}', 'logrado')">🏆 Lograda</button>` : `<button class="action-btn reactivate" onclick="updateEstado('${meta.id}', 'activo')">🔄 Reactivar</button>`}
                                    ${meta.estado === 'activo' ? `<button class="action-btn pause" onclick="updateEstado('${meta.id}', 'pausado')">⏸️</button>` : ''}
                                    ${meta.estado === 'pausado' ? `<button class="action-btn reactivate" onclick="updateEstado('${meta.id}', 'activo')">▶️</button>` : ''}
                                    <button class="action-btn delete" onclick="deleteMeta('${meta.id}')">🗑️</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleAvances(id) {
            const list = document.getElementById(`avances-${id}`);
            const btn = list.previousElementSibling;
            list.classList.toggle('show');
            btn.textContent = list.classList.contains('show') ? `▼ Ocultar avances` : `▶ Ver avances`;
        }

        function toggleAvanceForm(id) {
            document.getElementById(`avanceForm-${id}`).classList.toggle('show');
        }

        let selectedAvanceType = {};
        
        function selectAvanceType(id, type) {
            selectedAvanceType[id] = type;
            document.getElementById(`btnPositivo-${id}`).className = 'avance-type-btn' + (type === 'positivo' ? ' selected-positive' : '');
            document.getElementById(`btnNegativo-${id}`).className = 'avance-type-btn' + (type === 'negativo' ? ' selected-negative' : '');
        }

        function saveAvance(id) {
            const texto = document.getElementById(`avanceInput-${id}`).value.trim();
            if (!texto) { alert('Escribe qué avance tuviste'); return; }
            
            const tipo = selectedAvanceType[id] || 'positivo';
            const meta = metas.find(m => m.id === id);
            if (!meta) return;
            
            const nuevoAvance = {
                id: Date.now().toString(),
                fecha: new Date().toISOString(),
                texto,
                resultado: tipo
            };
            
            db.collection('metas').doc(id).update({
                avances: [...(meta.avances || []), nuevoAvance]
            }).then(() => {
                document.getElementById(`avanceInput-${id}`).value = '';
                toggleAvanceForm(id);
                delete selectedAvanceType[id];
            });
        }

        function updateEstado(id, estado) {
            db.collection('metas').doc(id).update({ estado });
        }

        function deleteMeta(id) {
            if (confirm('¿Eliminar esta meta?')) {
                db.collection('metas').doc(id).delete();
            }
        }

        function updateStats() {
            const total = metas.length;
            const activas = metas.filter(m => m.estado === 'activo').length;
            const logradas = metas.filter(m => m.estado === 'logrado').length;
            const inversion = metas.reduce((sum, m) => sum + (parseFloat(m.inversion) || 0), 0);
            
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statActivas').textContent = activas;
            document.getElementById('statLogradas').textContent = logradas;
            document.getElementById('statInversion').textContent = '$' + inversion.toLocaleString();
        }

        function updatePlant() {
            const totalLogros = metas.reduce((sum, m) => {
                const positivos = (m.avances || []).filter(a => a.resultado === 'positivo').length;
                const metaLograda = m.estado === 'logrado' ? 1 : 0;
                return sum + positivos + metaLograda;
            }, 0);
            
            let currentStage = PLANT_STAGES[0];
            let nextStage = PLANT_STAGES[1];
            
            for (let i = 0; i < PLANT_STAGES.length; i++) {
                if (totalLogros >= PLANT_STAGES[i].min) {
                    currentStage = PLANT_STAGES[i];
                    nextStage = PLANT_STAGES[i + 1] || null;
                }
            }
            
            document.getElementById('plantEmoji').textContent = currentStage.emoji;
            document.getElementById('plantStage').textContent = currentStage.name;
            document.getElementById('plantCount').textContent = `${totalLogros} logro${totalLogros !== 1 ? 's' : ''} alcanzado${totalLogros !== 1 ? 's' : ''}`;
            
            if (nextStage) {
                const progress = ((totalLogros - currentStage.min) / (nextStage.min - currentStage.min)) * 100;
                document.getElementById('currentStageLabel').textContent = `${currentStage.emoji} ${currentStage.name}`;
                document.getElementById('nextStageLabel').textContent = `${nextStage.emoji} ${nextStage.name}`;
                document.getElementById('progressFill').style.width = `${progress}%`;
                document.getElementById('progressText').textContent = `${nextStage.min - totalLogros} logro${(nextStage.min - totalLogros) !== 1 ? 's' : ''} más para evolucionar`;
                document.getElementById('progressContainer').style.display = 'block';
            } else {
                document.getElementById('progressContainer').innerHTML = '<p style="color:#22c55e;font-weight:600">🎉 ¡Has alcanzado el nivel máximo!</p>';
            }
        }
    </script>
</body>
</html>
