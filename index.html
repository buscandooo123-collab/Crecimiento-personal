<head>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);color:#fff;min-height:100vh}
        .hidden{display:none!important}
        
        #lockScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;user-select:none}
        .lock-header{text-align:center;margin-bottom:30px}
        .lock-header .emoji{font-size:56px;display:block;margin-bottom:16px}
        .lock-header h1{font-size:22px;background:linear-gradient(to right,#fbbf24,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}

        #lockError{color:#ef4444;font-size:14px;margin-top:10px;min-height:20px}
        #lockError.success{color:#22c55e}
        
        .pattern-area{width:280px;height:280px;position:relative;touch-action:none;background:rgba(255,255,255,.02);border-radius:24px;border:2px solid rgba(255,255,255,.1)}
        .pattern-dot{position:absolute;width:70px;height:70px;display:flex;align-items:center;justify-content:center}
        .dot-outer{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);transition:.15s}
        .dot-inner{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);transition:.15s}
        .pattern-dot.active .dot-outer{background:rgba(251,191,36,.2);transform:scale(1.15)}
        .pattern-dot.active .dot-inner{width:26px;height:26px;background:linear-gradient(135deg,#fbbf24,#f97316);box-shadow:0 0 20px rgba(249,115,22,.6)}
        .pattern-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
        .pattern-line{stroke:#f97316;stroke-width:5;stroke-linecap:round;fill:none}
        .reset-btn{margin-top:30px;padding:14px 28px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:14px;color:#64748b;font-size:14px;cursor:pointer}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:shake .3s}
        
        #mainApp{display:none;padding-bottom:100px}
        .container{max-width:600px;margin:0 auto;padding:16px}
        .header{text-align:center;padding:24px 0}
        .header h1{font-size:26px;background:linear-gradient(to right,#fbbf24,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
        .header p{color:#94a3b8;font-size:14px}
        .logout-btn{position:fixed;top:16px;right:16px;padding:10px 16px;background:rgba(255,255,255,.1);border:none;border-radius:12px;color:#94a3b8;font-size:13px;cursor:pointer;z-index:100}
        
        .plant-box{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.08));border-radius:24px;padding:24px;margin-bottom:24px;border:1px solid rgba(255,255,255,.1);text-align:center}
        .plant-emoji{font-size:72px;display:block;animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .plant-stage{font-size:18px;font-weight:700;color:#22c55e;margin:8px 0 4px;text-transform:capitalize}
        .plant-count{font-size:14px;color:#94a3b8;margin-bottom:16px}
        .progress-labels{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:8px}
        .progress-bar{height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:5px;transition:width .5s}
        .progress-text{font-size:12px;color:#64748b;margin-top:8px}
        
        .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}

        .stat-lbl{font-size:11px;color:#64748b;text-transform:uppercase}
        
        .action-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
        .btn-add{padding:14px 24px;background:linear-gradient(135deg,#f59e0b,#f97316);border:none;border-radius:14px;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
        .filter-sel{flex:1;min-width:140px;padding:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;font-size:14px;outline:none}
        .filter-sel option{background:#1e293b}
        
        .form-box{display:none;background:rgba(255,255,255,.05);border-radius:20px;padding:20px;margin-bottom:24px;border:1px solid rgba(255,255,255,.1)}
        .form-box.show{display:block}
        .form-title{font-size:18px;font-weight:700;margin-bottom:16px}
        .fg{margin-bottom:14px}
        .fg label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px}
        .fg input,.fg textarea,.fg select{width:100%;padding:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font-size:15px;font-family:inherit;outline:none}

        .btn-pri{flex:1;padding:14px;background:linear-gradient(135deg,#f59e0b,#f97316);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer}
        .btn-sec{padding:14px 20px;background:rgba(255,255,255,.1);border:none;border-radius:12px;color:#fff;cursor:pointer}
        
        .metas-list{display:flex;flex-direction:column;gap:16px}

        .empty .emoji{font-size:64px;display:block;margin-bottom:16px}

        .empty p{color:#64748b}
        .conn-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:16px;padding:20px;text-align:center;margin:20px 0}
        .conn-err .emoji{font-size:48px;display:block;margin-bottom:12px}
        .conn-err h3{color:#ef4444;margin-bottom:8px}
        .conn-err p{color:#94a3b8;font-size:14px;margin-bottom:16px;line-height:1.5}
        .conn-err button{padding:12px 24px;background:#ef4444;border:none;border-radius:10px;color:#fff;font-weight:600;cursor:pointer}
        
        .meta{background:rgba(255,255,255,.05);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
        .meta-inner{display:flex}
        .meta-accent{width:4px}
        .acc-salud{background:linear-gradient(180deg,#10b981,#059669)}.acc-estetica{background:linear-gradient(180deg,#ec4899,#db2777)}.acc-habilidad{background:linear-gradient(180deg,#3b82f6,#2563eb)}.acc-educacion{background:linear-gradient(180deg,#8b5cf6,#7c3aed)}.acc-habito{background:linear-gradient(180deg,#f59e0b,#d97706)}.acc-fitness{background:linear-gradient(180deg,#f97316,#ea580c)}.acc-finanzas{background:linear-gradient(180deg,#22c55e,#16a34a)}.acc-proyecto{background:linear-gradient(180deg,#6366f1,#4f46e5)}.acc-otro{background:linear-gradient(180deg,#64748b,#475569)}
        .meta-body{flex:1;padding:20px}
        .meta-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;flex-wrap:wrap}
        .meta-trow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
        .meta-emoji{font-size:24px}
        .meta-title{font-size:18px;font-weight:700}
        .meta-date{font-size:12px;color:#64748b}
        .badge{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
        .b-activo{background:rgba(59,130,246,.2);color:#3b82f6}
        .b-logrado{background:rgba(34,197,94,.2);color:#22c55e}
        .b-pausado{background:rgba(239,68,68,.2);color:#ef4444}
        .meta-stats{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;font-size:13px}
        .ms-lbl{color:#64748b}.ms-val{font-weight:700}
        .meta-desc{background:rgba(255,255,255,.05);padding:12px;border-radius:12px;border-left:3px solid #f59e0b;margin-bottom:12px}
        .meta-desc p{color:#94a3b8;font-size:14px;line-height:1.5}
        .meta-goal{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:12px;background:rgba(34,197,94,.15);color:#22c55e}
        .av-toggle{background:none;border:none;color:#64748b;font-size:13px;cursor:pointer;padding:8px 0}
        .av-list{display:none;margin-top:12px;max-height:200px;overflow-y:auto}
        .av-list.show{display:block}
        .av-item{display:flex;gap:12px;padding:12px;background:rgba(255,255,255,.03);border-radius:10px;margin-bottom:8px;font-size:14px}
        .av-icon{font-size:16px;font-weight:700}
        .av-icon.pos{color:#22c55e}.av-icon.neg{color:#ef4444}
        .av-txt{flex:1}.av-date{font-size:11px;color:#64748b;margin-top:4px}
        .av-form{display:none;padding:16px;background:rgba(255,255,255,.05);border-radius:12px;margin:12px 0}
        .av-form.show{display:block}
        .av-form input{width:100%;padding:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;color:#fff;font-size:14px;margin-bottom:12px;outline:none}
        .av-btns{display:flex;gap:8px;flex-wrap:wrap}
        .av-btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.1);color:#fff}
        .av-btn.sel-pos{background:#22c55e}.av-btn.sel-neg{background:#ef4444}.av-btn.save{background:#f59e0b}
        .meta-actions{display:flex;gap:8px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);flex-wrap:wrap}
        .act-btn{padding:10px 14px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer}
        .act-add{background:rgba(255,255,255,.1);color:#fff}
        .act-complete{background:rgba(34,197,94,.2);color:#22c55e}
        .act-react{background:rgba(59,130,246,.2);color:#3b82f6}
        .act-pause{background:rgba(249,115,22,.2);color:#f97316}
        .act-del{background:rgba(239,68,68,.1);color:#ef4444;margin-left:auto}
        .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
        .loading .emoji{font-size:56px;animation:float 2s ease-in-out infinite}
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading"><div class="emoji">🌱</div><p style="color:#94a3b8">Cargando...</p></div>
    
    <div id="lockScreen" class="hidden">
        <div class="lock-header">
            <span class="emoji">🌱</span>
            <h1>Mi Crecimiento Personal</h1>
            <p id="lockMsg">Dibuja tu patrón para entrar</p>
            <div id="lockError"></div>
        </div>
        <div class="pattern-area" id="patternArea"><svg class="pattern-svg" id="patternSvg"></svg></div>
        <button class="reset-btn" onclick="resetPattern()">🔄 Resetear patrón</button>
    </div>

    <div id="mainApp">
        <button class="logout-btn" onclick="logout()">🔒 Bloquear</button>
        <div class="container">
            <header class="header"><h1>Mi Crecimiento Personal</h1><p>Registra, aprende y crece cada día</p></header>
            <div class="plant-box">
                <span class="plant-emoji" id="plantEmoji">🌱</span>
                <div class="plant-stage" id="plantStage">semilla</div>
                <div class="plant-count" id="plantCount">0 logros alcanzados</div>
                <div id="progressBox"></div>
            </div>
            <div class="stats">
                <div class="stat"><div class="stat-icon">📊</div><div class="stat-val" id="sTotal">0</div><div class="stat-lbl">Total</div></div>
                <div class="stat"><div class="stat-icon">🔥</div><div class="stat-val" id="sActivas">0</div><div class="stat-lbl">Activas</div></div>
                <div class="stat"><div class="stat-icon">🏆</div><div class="stat-val" id="sLogradas">0</div><div class="stat-lbl">Logradas</div></div>
                <div class="stat"><div class="stat-icon">💵</div><div class="stat-val" id="sInv">$0</div><div class="stat-lbl">Invertido</div></div>

            <div class="action-row">
                <button class="btn-add" onclick="toggleForm()">+ Nueva Meta</button>
                <select class="filter-sel" id="filterSel" onchange="filterMetas()">
                    <option value="todas">Todas</option>
                    <option value="salud">🏥 Salud</option>
                    <option value="estetica">✨ Estética</option>
                    <option value="habilidad">🎯 Habilidad</option>
                    <option value="educacion">📚 Educación</option>
                    <option value="habito">🔄 Hábito</option>
                    <option value="fitness">💪 Fitness</option>
                    <option value="finanzas">💰 Finanzas</option>
                    <option value="proyecto">🚀 Proyecto</option>
                    <option value="otro">📌 Otro</option>
                </select>
            </div>
            <div class="form-box" id="formBox">
                <h2 class="form-title">✨ Nueva Meta</h2>
                <div class="fg"><label>¿Qué quieres lograr?</label><input type="text" id="inTitulo" placeholder="Ej: Aprender guitarra..."></div>
                <div class="fg"><label>Categoría</label>
                    <select id="inCat"><option value="salud">🏥 Salud</option><option value="estetica">✨ Estética</option><option value="habilidad" selected>🎯 Habilidad</option><option value="educacion">📚 Educación</option><option value="habito">🔄 Hábito</option><option value="fitness">💪 Fitness</option><option value="finanzas">💰 Finanzas</option><option value="proyecto">🚀 Proyecto</option><option value="otro">📌 Otro</option></select>
                </div>
                <div class="fg"><label>Descripción (opcional)</label><textarea id="inDesc" placeholder="Describe tu meta..."></textarea></div>
                <div class="form-row">
                    <div class="fg"><label>Fecha inicio</label><input type="date" id="inFecha"></div>
                    <div class="fg"><label>Inversión $</label><input type="number" id="inInv" placeholder="0" min="0"></div>
                </div>
                <div class="fg"><label>Meta final (opcional)</label><input type="text" id="inGoal" placeholder="Ej: Tocar 5 canciones..."></div>

            </div>
            <div class="metas-list" id="metasList"></div>
        </div>

<script>
const firebaseConfig={apiKey:"AIzaSyBfrsG0FreWxoGSLMtTTol0raK45nsmglE",authDomain:"crecimiento-personal-3e72d.firebaseapp.com",projectId:"crecimiento-personal-3e72d",storageBucket:"crecimiento-personal-3e72d.firebasestorage.app",messagingSenderId:"748066493575",appId:"1:748066493575:web:b5da1556caca9f7235d422"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const PK='mcp_pat_v4',SK='mcp_ses_v4',SD=30*60*1000;
let metas=[],curPat=[],isDrawing=false,patMode='check',tempPat=[],curFilter='todas';
const CATS={salud:{n:'Salud',e:'🏥'},estetica:{n:'Estética',e:'✨'},habilidad:{n:'Habilidad',e:'🎯'},educacion:{n:'Educación',e:'📚'},habito:{n:'Hábito',e:'🔄'},fitness:{n:'Fitness',e:'💪'},finanzas:{n:'Finanzas',e:'💰'},proyecto:{n:'Proyecto',e:'🚀'},otro:{n:'Otro',e:'📌'}};
const PLANTS=[{min:0,n:'semilla',e:'🌱'},{min:3,n:'brote',e:'🌿'},{min:7,n:'planta pequeña',e:'☘️'},{min:12,n:'planta mediana',e:'🪴'},{min:20,n:'arbusto',e:'🌳'},{min:30,n:'árbol',e:'🌲'},{min:50,n:'árbol frutal',e:'🍀'},{min:75,n:'jardín',e:'🌸'},{min:100,n:'bosque',e:'🌺'}];

document.addEventListener('DOMContentLoaded',init);

function init(){createDots();setupEvents();checkSession()}

function checkSession(){
    const s=localStorage.getItem(SK),p=localStorage.getItem(PK);
    if(s&&(Date.now()-parseInt(s))<SD){showMain()}
    else{localStorage.removeItem(SK);if(!p){patMode='create';document.getElementById('lockMsg').textContent='Crea tu patrón (mín. 4 puntos)'}showLock()}
}

function createDots(){
    const a=document.getElementById('patternArea');
    for(let i=0;i<9;i++){
        const r=Math.floor(i/3),c=i%3,d=document.createElement('div');
        d.className='pattern-dot';d.dataset.idx=i;
        d.style.left=`${c*33.33+16.66-12.5}%`;d.style.top=`${r*33.33+16.66-12.5}%`;
        d.innerHTML='<div class="dot-outer"><div class="dot-inner"></div></div>';
        a.appendChild(d);
    }
}

function setupEvents(){
    const a=document.getElementById('patternArea');
    a.addEventListener('mousedown',hStart);a.addEventListener('mousemove',hMove);
    a.addEventListener('mouseup',hEnd);a.addEventListener('mouseleave',hEnd);
    a.addEventListener('touchstart',hStart,{passive:false});
    a.addEventListener('touchmove',hMove,{passive:false});
    a.addEventListener('touchend',hEnd);
}

function getPos(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}}

function getDot(x,y){
    const dots=document.querySelectorAll('.pattern-dot');
    for(let d of dots){
        const r=d.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
        if(Math.sqrt((x-cx)**2+(y-cy)**2)<35)return parseInt(d.dataset.idx);
    }
    return -1;
}

function hStart(e){e.preventDefault();isDrawing=true;curPat=[];clearVis();document.getElementById('lockError').textContent='';const p=getPos(e),d=getDot(p.x,p.y);if(d>=0)addDot(d)}
function hMove(e){if(!isDrawing)return;e.preventDefault();const p=getPos(e),d=getDot(p.x,p.y);if(d>=0&&!curPat.includes(d))addDot(d)}
function hEnd(){if(!isDrawing)return;isDrawing=false;if(curPat.length<4){showErr('Mínimo 4 puntos');return}validate()}

function addDot(i){curPat.push(i);document.querySelectorAll('.pattern-dot')[i].classList.add('active');drawLines()}

function clearVis(){document.querySelectorAll('.pattern-dot').forEach(d=>d.classList.remove('active'));document.getElementById('patternSvg').innerHTML='';curPat=[]}

function drawLines(){
    const svg=document.getElementById('patternSvg'),dots=document.querySelectorAll('.pattern-dot'),ar=document.getElementById('patternArea').getBoundingClientRect();
    svg.innerHTML='';
    for(let i=1;i<curPat.length;i++){
        const f=dots[curPat[i-1]].getBoundingClientRect(),t=dots[curPat[i]].getBoundingClientRect();
        const l=document.createElementNS('http://www.w3.org/2000/svg','line');
        l.setAttribute('x1',f.left+f.width/2-ar.left);l.setAttribute('y1',f.top+f.height/2-ar.top);
        l.setAttribute('x2',t.left+t.width/2-ar.left);l.setAttribute('y2',t.top+t.height/2-ar.top);
        l.setAttribute('class','pattern-line');svg.appendChild(l);
    }
}

function validate(){
    const ps=curPat.join('-');
    if(patMode==='create'){tempPat=[...curPat];patMode='confirm';document.getElementById('lockMsg').textContent='Confirma tu patrón';setTimeout(clearVis,400)}
    else if(patMode==='confirm'){
        if(ps===tempPat.join('-')){localStorage.setItem(PK,ps);showOk('¡Patrón creado!');setTimeout(()=>{localStorage.setItem(SK,Date.now().toString());showMain()},800)}
        else{showErr('No coinciden');patMode='create';tempPat=[];document.getElementById('lockMsg').textContent='Crea tu patrón (mín. 4 puntos)'}
    }else{
        if(ps===localStorage.getItem(PK)){showOk('¡Bienvenido!');setTimeout(()=>{localStorage.setItem(SK,Date.now().toString());showMain()},500)}
        else showErr('Patrón incorrecto');
    }
}

function showErr(m){const e=document.getElementById('lockError');e.textContent=m;e.className='';document.getElementById('patternArea').classList.add('shake');setTimeout(()=>document.getElementById('patternArea').classList.remove('shake'),300);setTimeout(clearVis,500)}
function showOk(m){const e=document.getElementById('lockError');e.textContent=m;e.className='success'}
function resetPattern(){if(confirm('¿Resetear patrón?')){localStorage.removeItem(PK);patMode='create';tempPat=[];document.getElementById('lockMsg').textContent='Crea tu nuevo patrón';document.getElementById('lockError').textContent='';clearVis()}}

function showLock(){document.getElementById('loadingScreen').classList.add('hidden');document.getElementById('lockScreen').classList.remove('hidden');document.getElementById('mainApp').style.display='none'}
function showMain(){document.getElementById('loadingScreen').classList.add('hidden');document.getElementById('lockScreen').classList.add('hidden');document.getElementById('mainApp').style.display='block';loadMetas()}
function logout(){localStorage.removeItem(SK);patMode='check';document.getElementById('lockMsg').textContent='Dibuja tu patrón para entrar';document.getElementById('lockError').textContent='';clearVis();showLock()}

function loadMetas(){
    db.collection('metas').orderBy('fechaCreacion','desc').onSnapshot(s=>{
        metas=s.docs.map(d=>({id:d.id,...d.data()}));render();updateStats();updatePlant();
    },e=>{console.error(e);showConnErr()});
}

function showConnErr(){document.getElementById('metasList').innerHTML='<div class="conn-err"><span class="emoji">⚠️</span><h3>Error de conexión</h3><p>Verifica que hayas creado la base de datos Firestore en Firebase Console.<br><br>Ve a Firebase → Firestore Database → Crear base de datos → Modo de prueba</p><button onclick="location.reload()">🔄 Reintentar</button></div>'}

function saveMeta(){
    const t=document.getElementById('inTitulo').value.trim();if(!t){alert('Escribe un título');return}
    db.collection('metas').add({titulo:t,categoria:document.getElementById('inCat').value,descripcion:document.getElementById('inDesc').value.trim(),fechaInicio:document.getElementById('inFecha').value,inversion:document.getElementById('inInv').value||'0',metaFinal:document.getElementById('inGoal').value.trim(),estado:'activo',avances:[],fechaCreacion:new Date().toISOString()}).then(()=>{clearForm();toggleForm()}).catch(e=>{console.error(e);alert('Error al guardar')});
}

function clearForm(){['inTitulo','inDesc','inFecha','inInv','inGoal'].forEach(id=>document.getElementById(id).value='');document.getElementById('inCat').value='habilidad'}
function toggleForm(){document.getElementById('formBox').classList.toggle('show')}
function filterMetas(){curFilter=document.getElementById('filterSel').value;render()}

function render(){
    const c=document.getElementById('metasList'),f=curFilter==='todas'?metas:metas.filter(m=>m.categoria===curFilter);
    if(!f.length){c.innerHTML='<div class="empty"><span class="emoji">🌱</span><h3>Comienza tu viaje</h3><p>Agrega tu primera meta</p></div>';return}
    c.innerHTML=f.map(m=>{
        const cat=CATS[m.categoria]||CATS.otro,av=m.avances||[],pos=av.filter(a=>a.resultado==='positivo').length,pct=av.length?Math.round(pos/av.length*100):0;
        let bc='b-activo',bt='🔥 Activo';if(m.estado==='logrado'){bc='b-logrado';bt='🏆 Logrado'}if(m.estado==='pausado'){bc='b-pausado';bt='⏸️ Pausado'}
        return `<div class="meta"><div class="meta-inner"><div class="meta-accent acc-${m.categoria}"></div><div class="meta-body">
            <div class="meta-head"><div><div class="meta-trow"><span class="meta-emoji">${cat.e}</span><span class="meta-title">${m.titulo}</span></div>${m.fechaInicio?`<div class="meta-date">Inicio: ${fmtDate(m.fechaInicio)}</div>`:''}</div><span class="badge ${bc}">${bt}</span></div>
            <div class="meta-stats">${m.inversion&&parseFloat(m.inversion)>0?`<div><span class="ms-lbl">Inversión: </span><span class="ms-val" style="color:#f59e0b">$${parseFloat(m.inversion).toLocaleString()}</span></div>`:''}<div><span class="ms-lbl">Avances: </span><span class="ms-val">${av.length}</span></div>${av.length?`<div><span class="ms-lbl">Éxito: </span><span class="ms-val" style="color:${pct>=70?'#22c55e':pct>=40?'#f59e0b':'#ef4444'}">${pct}%</span></div>`:''}</div>
            ${m.descripcion?`<div class="meta-desc"><p>${m.descripcion}</p></div>`:''}
            ${m.metaFinal?`<div class="meta-goal"><span>🎯</span><span>${m.metaFinal}</span></div>`:''}
            ${av.length?`<button class="av-toggle" onclick="togAv('${m.id}')">▶ Ver ${av.length} avance(s)</button><div class="av-list" id="av-${m.id}">${av.slice().reverse().map(a=>`<div class="av-item"><span class="av-icon ${a.resultado==='positivo'?'pos':'neg'}">${a.resultado==='positivo'?'✓':'✗'}</span><div class="av-txt"><div>${a.texto}</div><div class="av-date">${fmtDate(a.fecha)}</div></div></div>`).join('')}</div>`:''}
            <div class="av-form" id="avf-${m.id}"><input type="text" id="avi-${m.id}" placeholder="¿Qué avance tuviste?"><div class="av-btns"><button class="av-btn" id="bp-${m.id}" onclick="selAvType('${m.id}','positivo')">✓ Cumplí</button><button class="av-btn" id="bn-${m.id}" onclick="selAvType('${m.id}','negativo')">✗ Fallé</button><button class="av-btn save" onclick="saveAv('${m.id}')">Guardar</button><button class="av-btn" onclick="togAvForm('${m.id}')">✕</button></div></div>
            <div class="meta-actions"><button class="act-btn act-add" onclick="togAvForm('${m.id}')">+ Avance</button>${m.estado!=='logrado'?`<button class="act-btn act-complete" onclick="updEst('${m.id}','logrado')">🏆 Lograda</button>`:`<button class="act-btn act-react" onclick="updEst('${m.id}','activo')">🔄 Reactivar</button>`}${m.estado==='activo'?`<button class="act-btn act-pause" onclick="updEst('${m.id}','pausado')">⏸️</button>`:''}${m.estado==='pausado'?`<button class="act-btn act-react" onclick="updEst('${m.id}','activo')">▶️</button>`:''}<button class="act-btn act-del" onclick="delMeta('${m.id}')">🗑️</button></div>
        </div></div></div>`;
    }).join('');
}

function fmtDate(d){try{return new Date(d).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}catch{return d}}
function togAv(id){const l=document.getElementById('av-'+id),v=l.classList.contains('show');l.classList.toggle('show');l.previousElementSibling.textContent=v?`▶ Ver ${(metas.find(m=>m.id===id)?.avances||[]).length} avance(s)`:'▼ Ocultar'}
function togAvForm(id){document.getElementById('avf-'+id).classList.toggle('show')}

const selTypes={};
function selAvType(id,t){selTypes[id]=t;document.getElementById('bp-'+id).className='av-btn'+(t==='positivo'?' sel-pos':'');document.getElementById('bn-'+id).className='av-btn'+(t==='negativo'?' sel-neg':'')}

function saveAv(id){
    const txt=document.getElementById('avi-'+id).value.trim();if(!txt){alert('Escribe qué avance tuviste');return}
    const m=metas.find(x=>x.id===id);if(!m)return;
    db.collection('metas').doc(id).update({avances:[...(m.avances||[]),{id:Date.now().toString(),fecha:new Date().toISOString(),texto:txt,resultado:selTypes[id]||'positivo'}]}).then(()=>{document.getElementById('avi-'+id).value='';togAvForm(id);delete selTypes[id]}).catch(e=>{console.error(e);alert('Error')});
}

function updEst(id,e){db.collection('metas').doc(id).update({estado:e}).catch(er=>alert('Error'))}
function delMeta(id){if(confirm('¿Eliminar esta meta?'))db.collection('metas').doc(id).delete().catch(e=>alert('Error'))}

function updateStats(){
    document.getElementById('sTotal').textContent=metas.length;
    document.getElementById('sActivas').textContent=metas.filter(m=>m.estado==='activo').length;
    document.getElementById('sLogradas').textContent=metas.filter(m=>m.estado==='logrado').length;
    document.getElementById('sInv').textContent='$'+metas.reduce((s,m)=>s+(parseFloat(m.inversion)||0),0).toLocaleString();
}

function updatePlant(){
    const total=metas.reduce((s,m)=>{const p=(m.avances||[]).filter(a=>a.resultado==='positivo').length;return s+p+(m.estado==='logrado'?1:0)},0);
    let cur=PLANTS[0],nxt=PLANTS[1];
    for(let i=0;i<PLANTS.length;i++)if(total>=PLANTS[i].min){cur=PLANTS[i];nxt=PLANTS[i+1]||null}
    document.getElementById('plantEmoji').textContent=cur.e;
    document.getElementById('plantStage').textContent=cur.n;
    document.getElementById('plantCount').textContent=`${total} logro${total!==1?'s':''} alcanzado${total!==1?'s':''}`;
    const pb=document.getElementById('progressBox');
    if(nxt){const pct=Math.min(100,((total-cur.min)/(nxt.min-cur.min))*100);pb.innerHTML=`<div class="progress-labels"><span>${cur.e} ${cur.n}</span><span>${nxt.e} ${nxt.n}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><p class="progress-text">${nxt.min-total} logro${(nxt.min-total)!==1?'s':''} más para evolucionar</p>`}
    else pb.innerHTML='<p style="color:#22c55e;font-weight:600;margin-top:12px">🎉 ¡Nivel máximo alcanzado!</p>';
}
</script>
</body>
</html>
